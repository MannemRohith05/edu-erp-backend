
# ===============================
# APPLICATION CONFIGURATION
# ===============================
spring.application.name=edu-erp-backend
server.port=${PORT:8080}

# ===============================
# MYSQL DATABASE
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edu_erp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# ===============================
# FLYWAY DATABASE MIGRATIONS
# ===============================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# ===============================
# JWT AUTHENTICATION
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ===============================
# GMAIL SMTP
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_USERNAME:${spring.mail.username:}}

# ===============================
# EMAIL OTP
# ===============================
app.auth.otp.length=${APP_AUTH_OTP_LENGTH:6}
app.auth.otp.expiration-minutes=${APP_AUTH_OTP_EXPIRATION_MINUTES:5}

# Institution-configurable grade-point mapping used for SGPA/CGPA.
app.academic.grade-points=${APP_ACADEMIC_GRADE_POINTS:A+=10,A=9,B=8,C=7,D=6,F=0}

# ===============================
# DEMO DATA
# ===============================
app.data.demo-password=${DEMO_PASSWORD:}
app.data.demo-admin-email=${DEMO_ADMIN_EMAIL:admin@example.invalid}

# Initial Super Admin provisioning. Leave unset to disable provisioning.
# The password is read only from the local environment and is never logged.
app.super-admin.first-name=${SUPER_ADMIN_FIRST_NAME:}
app.super-admin.last-name=${SUPER_ADMIN_LAST_NAME:Super Admin}
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.initial-password=${SUPER_ADMIN_INITIAL_PASSWORD:}

# ===============================
# LOGGING
# ===============================
logging.level.com.eduerp=INFO
logging.level.org.springframework.security=INFO

# ===============================
# API DOCUMENTATION
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===============================
# CORS
# ===============================
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5174,http://localhost:5173}
