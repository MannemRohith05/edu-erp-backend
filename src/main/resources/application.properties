
# ===============================
# APPLICATION CONFIGURATION
# ===============================
spring.application.name=edu-erp-backend
server.port=${PORT:8080}

# ===============================
# MYSQL DATABASE - AIVEN CLOUD
# Set DB_URL, DB_USERNAME and DB_PASSWORD in environment variables
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-1ecde58c-rohiths-edu-erp.j.aivencloud.com:13276/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# ===============================
# FLYWAY DATABASE MIGRATIONS
# IMPORTANT: Existing database already contains migrations.
# Disable automatic migrations initially to avoid unexpected changes.
# ===============================
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# ===============================
# JWT AUTHENTICATION
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ===============================
# GMAIL SMTP
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_USERNAME:${spring.mail.username:}}

# ===============================
# EMAIL OTP
# ===============================
app.auth.otp.length=${APP_AUTH_OTP_LENGTH:6}
app.auth.otp.expiration-minutes=${APP_AUTH_OTP_EXPIRATION_MINUTES:5}

# ===============================
# SMS PAYMENT NOTIFICATIONS
# ===============================
app.sms.provider=${SMS_PROVIDER:none}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from=${TWILIO_FROM_NUMBER:}
app.finance.notification-email=${FINANCE_NOTIFICATION_EMAIL:}

# ===============================
# ACADEMIC GRADE POINTS
# ===============================
app.academic.grade-points=${APP_ACADEMIC_GRADE_POINTS:A+=10,A=9,B=8,C=7,D=6,F=0}
app.academic.grade-boundaries=${APP_ACADEMIC_GRADE_BOUNDARIES:A+=90,A=80,B=70,C=60,D=50,F=0}

# ===============================
# TAX RULE BOUNDARY
# ===============================
app.tax.gst.enabled=${APP_TAX_GST_ENABLED:false}
app.tax.gst.rate=${APP_TAX_GST_RATE:0}
app.tax.gst.applicable-categories=${APP_TAX_GST_APPLICABLE_CATEGORIES:}

# ===============================
# RAZORPAY
# ===============================
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.base-url=${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}

# ===============================
# DEMO DATA
# ===============================
app.data.demo-password=${DEMO_PASSWORD:}
app.data.demo-admin-email=${DEMO_ADMIN_EMAIL:admin@example.invalid}

# ===============================
# SUPER ADMIN PROVISIONING
# ===============================
app.super-admin.first-name=${SUPER_ADMIN_FIRST_NAME:}
app.super-admin.last-name=${SUPER_ADMIN_LAST_NAME:Super Admin}
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.initial-password=${SUPER_ADMIN_INITIAL_PASSWORD:}

# ===============================
# LOGGING
# ===============================
logging.level.com.eduerp=INFO
logging.level.org.springframework.security=INFO

# ===============================
# API DOCUMENTATION
# ===============================
app.api-docs.public=${API_DOCS_PUBLIC:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===============================
# CORS
# Add your deployed frontend URL using CORS_ALLOWED_ORIGIN_PATTERNS
# ===============================
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
